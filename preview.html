<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview tema moderno</title>
  <link rel="stylesheet" href="./modern-theme.css" />
</head>
<body>
  <main class="wrapper" style="padding: 24px; margin-top: 24px;">
    <header style="padding: 20px;">
      <h1>Loopsound Developer</h1>
      <p>Estilo modernizado para área de desenvolvedor.</p>
      <button>Publicar atualização</button>
    </header>

    <section class="panel" style="padding: 20px;">
      <h2>Formulário</h2>
      <form>
        <label>Nome do pacote</label>
        <input placeholder="Ex: ls-audio-kit" />
      </form>
    </section>

    <section class="card" style="padding: 20px;">
      <h2>Builds recentes</h2>
      <table>
        <thead><tr><th>Versão</th><th>Status</th><th>Data</th></tr></thead>
        <tbody>
          <tr><td>2.4.1</td><td><span class="success">Sucesso</span></td><td>20/02/2026</td></tr>
          <tr><td>2.4.0</td><td><span class="warning">Em validação</span></td><td>19/02/2026</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
